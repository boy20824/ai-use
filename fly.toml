# Change `app` if that name is already taken. Do not put secrets in this file.
app = "ai-use"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/app.sqlite"
  UPLOAD_DIR = "/data/uploads"
  STATIC_DIR = "/app/dist"
  SAMPLE_TEMPLATE_PATH = "/app/public/samples/field-note.docx"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "data"
  destination = "/data"
